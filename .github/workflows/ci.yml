name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: test-project
      GCP_LOCATION: us-central1
      FIRESTORE_DATABASE_ID: "(default)"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff lint
        working-directory: backend
        run: ruff check . --config pyproject.toml

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # Plain `tsc --noEmit` is a no-op here: frontend/tsconfig.json is solution-style
      # (`"files": []`, only project references), so without `-b` tsc resolves zero
      # source files and exits 0 regardless of type errors. `-b` follows the
      # references (tsconfig.app.json + tsconfig.node.json, same as `npm run build`'s
      # `tsc -b`) so this step actually type-checks src/; `--noEmit` overrides both
      # referenced projects' emit so this only writes .tsbuildinfo caches under
      # node_modules/.tmp (gitignored), never dist/ output.
      - name: Type-check
        run: npx tsc -b --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Run frontend tests
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
